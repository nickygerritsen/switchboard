# Switchboard Configuration Example
# Copy this file to your config directory and modify as needed:
#   Linux/macOS: ~/.config/switchboard/config.yaml
#   Windows: %APPDATA%\switchboard\config.yaml

# Default browser to use when no rules match
defaultBrowser: chrome

# Enable debug logging
debug: false

# Log file location
# Use "auto" for OS-specific default location:
#   macOS: ~/Library/Logs/switchboard/switchboard.log
#   Linux: ~/.local/state/switchboard/switchboard.log
#   Windows: %LOCALAPPDATA%\switchboard\logs\switchboard.log
# Or specify a custom path
logFile: auto

# Browser definitions (optional - browsers are auto-detected by default)
# Specify custom paths for browsers if they're not in standard locations
browsers:
  chrome:
    path: auto  # Will auto-detect
  firefox:
    path: auto
  brave:
    path: auto
  vivaldi:
    path: auto
  safari:
    path: auto  # macOS only
  # Custom browser example:
  # firefox-dev:
  #   path: /usr/bin/firefox-developer-edition

# URL routing rules
# Rules are evaluated in order - first match wins
rules:
  # Google services in Firefox
  - match:
      - "google.com"
      - "google.com/*"
      - "*.google.com"
      - "*.google.com/*"
    browser: firefox

  # Work-related sites in Chrome with work profile
  - match:
      - "company.com"
      - "company.com/*"
      - "*.company.com"
      - "*.company.com/*"
      - "slack.com"
      - "slack.com/*"
      - "*.slack.com"
      - "*.slack.com/*"
    browser: chrome
    profile: Work  # Chrome profile name

  # GitHub and development sites in Brave
  - match:
      - "github.com"
      - "github.com/*"
      - "*.github.com"
      - "*.github.com/*"
      - "gitlab.com"
      - "gitlab.com/*"
      - "*.gitlab.com"
      - "*.gitlab.com/*"
    browser: brave

  # Local development in Chrome with dev profile
  - match:
      - "localhost"
      - "localhost/*"
      - "localhost:*"
      - "localhost:*/*"
      - "127.0.0.1"
      - "127.0.0.1/*"
      - "127.0.0.1:*"
      - "127.0.0.1:*/*"
      - "*.local"
      - "*.local/*"
    browser: chrome
    profile: Development

  # Social media in Firefox
  - match:
      - "facebook.com"
      - "facebook.com/*"
      - "*.facebook.com"
      - "*.facebook.com/*"
      - "instagram.com"
      - "instagram.com/*"
      - "*.instagram.com"
      - "*.instagram.com/*"
    browser: firefox

  # URL rewriting examples - redirect to privacy-friendly frontends
  # Twitter/X → xcancel (privacy frontend)
  - match:
      - "twitter.com"
      - "twitter.com/*"
      - "*.twitter.com"
      - "*.twitter.com/*"
      - "x.com"
      - "x.com/*"
      - "*.x.com"
      - "*.x.com/*"
    rewrite: "xcancel.com{path}"  # Rewrite URL before opening
    browser: firefox

  # Available template variables for rewriting:
  # {scheme}   - URL scheme (http, https)
  # {host}     - Hostname (e.g., "example.com")
  # {port}     - Port number (empty if not specified)
  # {path}     - Path portion (e.g., "/foo/bar")
  # {query}    - Query string (e.g., "key=value")
  # {fragment} - Fragment/hash (e.g., "section")

  # Banking sites in Chrome with incognito mode
  - match:
      - "bank.com"
      - "bank.com/*"
      - "*.bank.com"
      - "*.bank.com/*"
    browser: chrome
    incognito: true
